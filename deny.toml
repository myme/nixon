[graph]
all-features = true

[advisories]
ignore = []

# ENGINEERING §6: MIT, Apache-2.0, BSD-*, MPL-2.0 (nucleo), Unicode-3.0.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MPL-2.0",
  "Unicode-3.0",
  "ISC",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
